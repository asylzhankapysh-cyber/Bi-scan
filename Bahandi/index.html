<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="B-scan — интеллектуальная система списаний для отправителей ресторанов">
    <title>B-scan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="utilities.css">
    <link rel="stylesheet" href="styles.css">
    <script src="js/config.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script src="js/services.js" defer></script>
    <script src="js/views.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>
    <div id="app" aria-live="polite">
        <div class="splash-screen" role="status" aria-label="Загрузка приложения">
            <div class="brand-mark brand-mark-large"><i class="fa-solid fa-sparkles" aria-hidden="true"></i></div>
            <div class="brand-wordmark">B-scan</div>
            <div class="splash-loader"><span></span><span></span><span></span></div>
        </div>
    </div>
    <div class="network-banner" id="network-banner" role="status" hidden>
        <i class="fa-solid fa-wifi" aria-hidden="true"></i>
        <span>Нет сети. Изменения сохранятся локально.</span>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="dialog-root"></div>
    <noscript><div class="fatal-state">Для работы B-scan необходим JavaScript.</div></noscript>
</body>
</html>
